<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scrapline</title>
    <style>
      body {
        margin: 0;
        background: #05070f;
        color: #cbd5e1;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 24px;
      }
      #stage {
        position: relative;
        width: min(640px, 90vw);
      }
      #game {
        border: 1px solid #334155;
        width: 100%;
        height: auto;
        display: block;
        background: #0b1020;
      }
      #menu {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(5, 7, 15, 0.82);
      }
      #menu h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 1px;
      }
      #play {
        font-size: 16px;
        padding: 10px 22px;
        border: 1px solid #7df9ff;
        border-radius: 6px;
        background: #0b1020;
        color: #7df9ff;
        cursor: pointer;
      }
      #play:hover {
        background: #16213a;
      }
      #hud {
        position: absolute;
        top: 8px;
        left: 8px;
        right: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        font-size: 12px;
        color: #e2e8f0;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      .hud-bar {
        width: 90px;
        height: 8px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 4px;
        overflow: hidden;
      }
      #hud-fuel {
        height: 100%;
        width: 100%;
        background: #22d3ee;
      }
      #killfeed {
        position: absolute;
        right: 8px;
        bottom: 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 12px;
        color: #f8fafc;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
        text-align: right;
      }
      #respawn {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: #f8fafc;
        text-shadow: 0 1px 4px #000;
        pointer-events: none;
      }
      #end-screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(5, 7, 15, 0.85);
      }
      #end-screen h2 {
        margin: 0;
        font-size: 24px;
      }
      #restart {
        font-size: 14px;
        padding: 8px 18px;
        border: 1px solid #7df9ff;
        border-radius: 6px;
        background: #0b1020;
        color: #7df9ff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game" width="640" height="360"></canvas>
      <div id="menu">
        <h1>Scrapline</h1>
        <button id="play">Play vs bots</button>
      </div>
      <div id="hud" style="display: none">
        <div>HP <span id="hud-health">100</span></div>
        <div class="hud-bar"><div id="hud-fuel"></div></div>
        <div id="hud-ammo"></div>
        <div id="hud-score"></div>
        <div id="hud-timer"></div>
      </div>
      <div id="killfeed"></div>
      <div id="respawn" style="display: none"></div>
      <div id="end-screen" style="display: none">
        <h2>Match over</h2>
        <div id="end-standings"></div>
        <button id="restart">Play again</button>
      </div>
    </div>
    <p>If the canvas above stays black, JavaScript is disabled.</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
